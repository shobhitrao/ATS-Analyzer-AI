<!DOCTYPE html>
<html>
<head>
<title>Reset Password | ATS Analyzer AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
padding:20px;
}

.box{
background:#111827;
padding:40px;
border-radius:20px;
width:400px;
box-shadow:0 0 30px rgba(0,0,0,.45);
}

h1{
text-align:center;
color:#38bdf8;
margin-bottom:25px;
font-size:34px;
}

input{
width:100%;
height:55px;
padding:0 18px;
margin:15px 0;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
font-size:17px;
outline:none;
}

input:focus{
border:2px solid #38bdf8;
}

button{
width:100%;
height:55px;
margin-top:10px;
background:#22c55e;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#16a34a;
}

button:disabled{
opacity:.7;
cursor:not-allowed;
}

.error{
margin-bottom:15px;
padding:12px;
background:#7f1d1d;
color:#fecaca;
border-radius:10px;
text-align:center;
}

.success{
margin-bottom:15px;
padding:12px;
background:#14532d;
color:#bbf7d0;
border-radius:10px;
text-align:center;
}

a{
display:block;
margin-top:20px;
text-align:center;
color:#38bdf8;
text-decoration:none;
}

@media(max-width:500px){

.box{
width:100%;
padding:25px;
}

h1{
font-size:28px;
}

}

</style>

</head>

<body>

<div class="box">

<h1>🔒 Reset Password</h1>

{% if error %}
<div class="error">
{{ error }}
</div>
{% endif %}

{% if success %}
<div class="success">
{{ success }}
</div>
{% endif %}

<form method="POST">

<input
type="password"
name="password"
placeholder="Enter New Password"
autocomplete="new-password"
minlength="8"
required>

<button
type="submit"
id="resetBtn">
🔒 Update Password
</button>

</form>

<a href="/login">⬅ Back to Login</a>

</div>

<script>

document.querySelector("form").addEventListener("submit", function(){

const btn = document.getElementById("resetBtn");

btn.innerHTML = "⏳ Updating Password...";

btn.disabled = true;

});

</script>

</body>
</html>
