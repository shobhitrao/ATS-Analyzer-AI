<!DOCTYPE html>
<html>

<head>

<title>Change Password</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#1e293b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#111827;
padding:35px;
border-radius:20px;
width:420px;
color:white;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

h2{
text-align:center;
color:#38bdf8;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:10px;
background:#1f2937;
color:white;
box-sizing:border-box;
}

button{
width:100%;
margin-top:20px;
padding:14px;
border:none;
border-radius:10px;
background:#22c55e;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.back{
display:block;
margin-top:18px;
text-align:center;
color:#38bdf8;
text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<h2>🔐 Change Password</h2>

<form method="POST">

<input
type="password"
name="old_password"
placeholder="Old Password"
required>

<input
type="password"
name="new_password"
placeholder="New Password"
required>

<input
type="password"
name="confirm_password"
placeholder="Confirm Password"
required>

<button type="submit">
Change Password
</button>

</form>

<a class="back" href="/">
⬅ Back to Dashboard
</a>

</div>

</body>

</html>
